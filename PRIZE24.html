<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRIZE24</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#050500; font-family:'Share Tech Mono',monospace; color:#fff; min-height:100vh; overflow:hidden; }
  .screen { display:none; width:100%; height:100vh; }
  .screen.active { display:flex; }

  #matrix-canvas { position:fixed; top:0; left:0; z-index:0; opacity:0.15; pointer-events:none; }
  .scan-line {
    position:fixed; top:0; left:0; right:0; height:2px;
    background:linear-gradient(90deg,transparent,rgba(255,220,0,0.3),transparent);
    animation:scan 3s linear infinite; z-index:1;
  }
  @keyframes scan { 0%{top:0} 100%{top:100vh} }

  /* ===== LOGIN ===== */
  #login-screen { align-items:center; justify-content:center; flex-direction:column; }
  .login-box {
    position:relative; z-index:2;
    background:rgba(10,8,0,0.95);
    border:1px solid #ccaa00; border-radius:6px;
    padding:40px 36px 32px;
    width:min(420px, 92vw);
    box-shadow:0 0 60px rgba(200,170,0,0.2), inset 0 0 60px rgba(200,170,0,0.03);
    animation:fadeSlideUp 0.6s cubic-bezier(0.22,1,0.36,1) both;
  }
  @keyframes fadeSlideUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }
  .corner { position:absolute; width:14px; height:14px; border-color:#ffdd00; border-style:solid; }
  .corner.tl{top:-1px;left:-1px;border-width:2px 0 0 2px}
  .corner.tr{top:-1px;right:-1px;border-width:2px 2px 0 0}
  .corner.bl{bottom:-1px;left:-1px;border-width:0 0 2px 2px}
  .corner.br{bottom:-1px;right:-1px;border-width:0 2px 2px 0}

  .logo {
    font-family:'Orbitron',monospace; font-size:clamp(30px,10vw,46px);
    font-weight:900; color:#ffdd00; text-align:center;
    letter-spacing:6px; margin-bottom:4px;
    text-shadow:0 0 24px rgba(255,220,0,0.7);
  }
  .logo-sub { font-size:10px; color:#554400; text-align:center; letter-spacing:6px; margin-bottom:32px; }
  .field-label { font-size:11px; color:#887700; letter-spacing:3px; margin-bottom:8px; display:block; }
  .field-input {
    width:100%; background:rgba(20,16,0,0.9); border:1px solid #332200;
    border-radius:3px; color:#ffdd00; font-family:'Share Tech Mono',monospace;
    font-size:16px; padding:12px 16px; margin-bottom:20px; outline:none;
    transition:border-color 0.2s,box-shadow 0.2s; letter-spacing:2px;
  }
  .field-input:focus { border-color:#ccaa00; box-shadow:0 0 12px rgba(200,170,0,0.2); }
  .field-input::placeholder { color:#2a1a00; }
  .login-btn {
    width:100%; background:linear-gradient(90deg,#ccaa00,#ffdd00,#cc8800);
    border:none; border-radius:3px; color:#000;
    font-family:'Orbitron',monospace; font-size:13px; font-weight:900;
    letter-spacing:4px; padding:14px; cursor:pointer; transition:all 0.2s; margin-top:4px;
  }
  .login-btn:hover { box-shadow:0 0 30px rgba(255,220,0,0.5); transform:translateY(-1px); }
  .login-btn:active { transform:scale(0.98); }
  .error-msg { color:#ff6600; font-size:11px; text-align:center; margin-top:12px; letter-spacing:2px; min-height:16px; }

  /* ===== LOADING ===== */
  #loading-screen { align-items:center; justify-content:center; flex-direction:column; gap:30px; }

  .load-steps { display:flex; flex-direction:column; gap:26px; width:min(380px,88vw); z-index:2; }
  .load-step {
    display:flex; align-items:center; gap:16px;
    font-family:'Orbitron',monospace; font-size:clamp(16px,4.5vw,22px);
    font-weight:700; letter-spacing:2px; color:#443300;
    transition:color 0.3s;
  }
  .load-step.active { color:#ffdd00; text-shadow:0 0 10px rgba(255,220,0,0.5); }
  .load-step.done   { color:#886600; }
  .step-icon {
    width:36px; height:36px; border-radius:50%;
    border:2px solid #332200; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:18px; transition:all 0.3s;
  }
  .load-step.active .step-icon {
    border-color:#ffdd00;
    box-shadow:0 0 12px rgba(255,220,0,0.4);
    animation:spinIcon 0.8s linear infinite;
  }
  .load-step.done .step-icon {
    border-color:#886600; background:rgba(136,102,0,0.2);
  }
  @keyframes spinIcon { to{transform:rotate(360deg)} }

  .progress-wrap { width:min(380px,88vw); z-index:2; }
  .progress-bar-bg {
    width:100%; height:5px; background:rgba(80,60,0,0.3);
    border:1px solid #332200; border-radius:3px; overflow:hidden; margin-bottom:8px;
  }
  .progress-bar-fill {
    height:100%; width:0%;
    background:linear-gradient(90deg,#886600,#ffdd00,#fff700);
    border-radius:3px; transition:width 0.4s linear;
    box-shadow:0 0 10px rgba(255,220,0,0.7);
  }
  .progress-pct { font-size:11px; color:#ccaa00; letter-spacing:2px; text-align:left; }

  /* ===== DASHBOARD ===== */
  #dashboard-screen { flex-direction:column; align-items:center; justify-content:center; gap:32px; }
  .dash-header {
    position:absolute; top:20px; left:0; right:0;
    display:flex; justify-content:space-between; align-items:center;
    padding:0 28px; z-index:2;
  }
  .dash-logo { font-family:'Orbitron',monospace; font-size:14px; font-weight:900; color:#ccaa00; letter-spacing:4px; }
  .dash-uid  { font-size:10px; color:#443300; letter-spacing:3px; }

  .display {
    width:min(340px,85vw); height:170px;
    background:#0a0a08; border:1px solid #332200; border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden; z-index:2;
  }
  .idle-hint { font-size:12px; color:#332200; letter-spacing:4px; }
  .result-num {
    font-family:'Orbitron',monospace;
    font-size:clamp(52px,15vw,76px);
    font-weight:900; color:#ffdd00;
    letter-spacing:4px; opacity:0; position:absolute; z-index:2;
  }
  @keyframes numIn {
    0%   { opacity:0; transform:translateY(22px) scale(0.8); filter:blur(8px); }
    60%  { opacity:1; transform:translateY(-4px) scale(1.06); filter:blur(0); }
    80%  { transform:translateY(2px) scale(0.98); }
    100% { opacity:1; transform:translateY(0) scale(1); filter:blur(0); }
  }
  .result-num.show { animation:numIn 0.55s cubic-bezier(0.22,1,0.36,1) forwards; }

  /* أنيميشن الـ AGAIN - بيتقلب */
  @keyframes rollOut {
    0%   { opacity:1; transform:translateY(0) scale(1); }
    100% { opacity:0; transform:translateY(-30px) scale(0.9); filter:blur(6px); }
  }
  .result-num.rollout { animation:rollOut 0.3s ease-in forwards; }

  .btn-group { display:flex; gap:16px; z-index:2; }
  .game-btn {
    font-family:'Orbitron',monospace; font-size:clamp(12px,3.5vw,15px);
    font-weight:900; letter-spacing:4px;
    width:clamp(120px,38vw,148px); height:52px;
    border-radius:3px; cursor:pointer; transition:all 0.18s;
  }
  .btn-start {
    background:linear-gradient(135deg,#ccaa00,#ffdd00);
    border:none; color:#000; box-shadow:0 0 18px rgba(255,220,0,0.3);
  }
  .btn-start:hover { box-shadow:0 0 36px rgba(255,220,0,0.55); transform:translateY(-2px); }
  .btn-again { background:transparent; border:1px solid #443300; color:#665500; }
  .btn-again:hover { border-color:#ccaa00; color:#ccaa00; transform:translateY(-2px); }
  .btn-start:active,.btn-again:active { transform:scale(0.96); }
  .dash-footer { position:absolute; bottom:12px; font-size:9px; color:#151500; letter-spacing:3px; }
</style>
</head>
<body>

<canvas id="matrix-canvas"></canvas>
<div class="scan-line"></div>

<!-- LOGIN -->
<div id="login-screen" class="screen active">
  <div class="login-box">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
    <div class="logo">PRIZE24</div>
    <div class="logo-sub">SIMULATOR SYSTEM v2.0</div>
    <label class="field-label">// USER_ID &nbsp;(10 أرقام)</label>
    <input id="user-id" class="field-input" type="text" maxlength="10" placeholder="0000000000" autocomplete="off" inputmode="numeric">
    <label class="field-label">// PASSWORD</label>
    <input id="password" class="field-input" type="password" placeholder="ادخل الباسورد" autocomplete="off">
    <button class="login-btn" onclick="doLogin()">تسجيل الدخول ←</button>
    <div id="err" class="error-msg"></div>
  </div>
</div>

<!-- LOADING -->
<div id="loading-screen" class="screen">
  <div class="load-steps" id="load-steps">
    <div class="load-step" id="ls0"><div class="step-icon">◌</div><span>جاري تحميل البيانات</span></div>
    <div class="load-step" id="ls1"><div class="step-icon">◌</div><span>جاري جمع المعلومات الخاصة بالحساب</span></div>
    <div class="load-step" id="ls2"><div class="step-icon">◌</div><span>جاري التحقق من الهوية</span></div>
    <div class="load-step" id="ls3"><div class="step-icon">◌</div><span>جاري الاتصال بسيرفرات اللعبة</span></div>
    <div class="load-step" id="ls4"><div class="step-icon">◌</div><span>جاري تهيئة بيئة اللعب</span></div>
    <div class="load-step" id="ls5"><div class="step-icon">◌</div><span>تم الاتصال بنجاح</span></div>
  </div>
  <div class="progress-wrap">
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="prog-fill"></div></div>
    <div class="progress-pct" id="prog-pct">0%</div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard-screen" class="screen">
  <div class="dash-header">
    <div class="dash-logo">PRIZE24</div>
    <div class="dash-uid" id="uid-display">USER: —</div>
  </div>
  <div class="display" id="display">
    <div class="idle-hint" id="idle-hint">اضغط START</div>
    <div class="result-num" id="result-num"></div>
  </div>
  <div class="btn-group">
    <button class="game-btn btn-start" onclick="doStart()">START</button>
    <button class="game-btn btn-again" id="btn-again" onclick="doAgain()">AGAIN</button>
  </div>
  <div class="dash-footer">FICTIONAL SIMULATOR — FOR ENTERTAINMENT ONLY</div>
</div>

<script>
// ===== Matrix =====
const canvas=document.getElementById('matrix-canvas'),ctx=canvas.getContext('2d');
canvas.width=window.innerWidth; canvas.height=window.innerHeight;
window.addEventListener('resize',()=>{canvas.width=window.innerWidth;canvas.height=window.innerHeight;initM();});
const chars='0123456789ABCDEF<>{}[]=>+-*/&|!?@#$%^~';
const fs=13; let cols,drops;
function initM(){cols=Math.floor(canvas.width/fs);drops=Array(cols).fill(1);} initM();
function drawMatrix(){
  ctx.fillStyle='rgba(5,5,0,0.05)';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.font=fs+'px Share Tech Mono,monospace';
  for(let i=0;i<drops.length;i++){
    const ch=chars[Math.floor(Math.random()*chars.length)];
    const r=Math.random();
    ctx.fillStyle=r<0.3?'#ffdd00':r<0.6?'#886600':'#443300';
    ctx.fillText(ch,i*fs,drops[i]*fs);
    if(drops[i]*fs>canvas.height&&Math.random()>0.975)drops[i]=0;
    drops[i]++;
  }
} setInterval(drawMatrix,40);

// ===== Screens =====
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}

// ===== Password =====
function buildPassword(uid){
  const syms=['@','#','$','%']; let r='';
  for(let i=0;i<uid.length;i+=2){
    if(i>0)r+=syms[((i/2)-1)%syms.length];
    r+=uid.substring(i,i+2);
  } return r;
}

// ===== Login =====
function doLogin(){
  const uid=document.getElementById('user-id').value.trim();
  const pass=document.getElementById('password').value.trim();
  const err=document.getElementById('err');
  if(!/^\d{10}$/.test(uid)){err.textContent='// خطأ: الـ USER_ID لازم يكون 10 أرقام';return;}
  if(pass!==buildPassword(uid)){err.textContent='// خطأ: الباسورد غلط';return;}
  err.textContent='';
  document.getElementById('uid-display').textContent='USER: '+uid;
  show('loading-screen'); startLoading();
}

// ===== Loading - خطوات بتتكمل وبعدين صح =====
function startLoading(){
  const fill=document.getElementById('prog-fill');
  const pct=document.getElementById('prog-pct');
  const totalSteps=6;
  const stepDuration=1600; // كل خطوة ~1.6 ثانية = 10 ثواني كلها
  let currentStep=0;

  function activateStep(i){
    const el=document.getElementById('ls'+i);
    if(!el)return;
    el.classList.add('active');
    el.querySelector('.step-icon').textContent='◌';
  }

  function doneStep(i){
    const el=document.getElementById('ls'+i);
    if(!el)return;
    el.classList.remove('active');
    el.classList.add('done');
    el.querySelector('.step-icon').textContent='✓';
  }

  activateStep(0);

  const iv=setInterval(()=>{
    doneStep(currentStep);
    currentStep++;
    const progress=Math.round((currentStep/totalSteps)*100);
    fill.style.width=progress+'%';
    pct.textContent=progress+'%';
    if(currentStep>=totalSteps){
      clearInterval(iv);
      setTimeout(()=>show('dashboard-screen'),600);
      return;
    }
    activateStep(currentStep);
  }, stepDuration);
}

// ===== رقم عشوائي بتوزيع مرجح =====
// 60% أقل من 8 → من 1.00 إلى 7.99
// 40% من 8.00 إلى 25.22
function getWeightedNumber(){
  const roll=Math.random();
  let val;
  if(roll<0.60){
    val=Math.random()*(7.99-1.00)+1.00;
  } else {
    val=Math.random()*(25.22-8.00)+8.00;
  }
  return val.toFixed(2);
}

// ===== Dashboard =====
let started=false;
let busy=false;

function showNumber(num){
  const hint=document.getElementById('idle-hint');
  const el=document.getElementById('result-num');
  hint.style.display='none';
  el.textContent=num;
  el.classList.remove('show','rollout');
  el.style.opacity='';
  void el.offsetWidth; // إعادة رسم عشان الأنيميشن يشتغل كل مرة
  el.classList.add('show');
}

function doStart(){
  if(busy)return;
  showNumber(getWeightedNumber());
  started=true;
}

function doAgain(){
  if(!started||busy)return;
  busy=true;
  const el=document.getElementById('result-num');
  // 1) الرقم الحالي بيتقلب ويختفي
  el.classList.remove('show');
  el.classList.add('rollout');
  // 2) بعد ما يختفي بالكامل، نضمن إن الأنيميشن القديم اتشال
  setTimeout(()=>{
    el.classList.remove('rollout');
    el.style.opacity='0';
    // 3) رقم جديد بتوزيع مرجح
    setTimeout(()=>{
      showNumber(getWeightedNumber());
      busy=false;
    },120);
  },320);
}

document.getElementById('user-id').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
</script>
</body>
</html>
